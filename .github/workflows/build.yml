name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build || npx vite build || true
          mkdir -p dist
          if [ -d "build" ]; then cp -r build/* dist/; fi
          if [ ! -f "dist/index.html" ] && [ -f "index.html" ]; then cp index.html dist/; fi

      - name: Setup Capacitor & Android Platform
        run: |
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 --save-dev --legacy-peer-deps
          npx cap init "Gemini Chat" "com.example.geminichat" --web-dir dist || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Xmx2048m --warning-mode none

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-chat-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
